perception_node:
  ros__parameters:
    # Must match simulation's world_name (simulation/config/simulation_params.yaml) --
    # this is how perception_node finds the bridged ground-truth topic.
    world_name: "multi_obstacle_arena"

    # Assumption, not a confirmed fact (see README's design notes): the gz-sim
    # world-pose bridge's exact parent frame_id on each TransformStamped hasn't been
    # verified against a real Harmonic install. Kept as a parameter so it's a one-line
    # fix in this file, not a code change, if `ros2 topic echo .../pose/info` disagrees.
    detection_frame_id: "world"

    # Deliberately decoupled from the pose/info message rate -- perception_node
    # publishes from its cache on this timer, independent of Gazebo's own update rate.
    publish_rate_hz: 10.0

    # Ground-truth pose/info reports position only, not entity extent, so bounding-box
    # size is approximated from simulation's spawn parameters
    # (simulation/config/simulation_params.yaml) rather than measured per entity.
    # Midpoint of static_obstacle_min_size/static_obstacle_max_size (0.3-0.6).
    static_obstacle_size: 0.45
    # 2 * simulation's dynamic_obstacle_radius (0.2).
    dynamic_obstacle_diameter: 0.4
    # Matches the fixed cylinder <length> in simulation_manager's dynamic obstacle SDF.
    dynamic_obstacle_height: 0.3

camera_node:
  ros__parameters:
    image_topic: "/pi_camera/image_raw"
    heartbeat_period_sec: 5.0

lidar_node:
  ros__parameters:
    scan_topic: "/scan"
    heartbeat_period_sec: 5.0
